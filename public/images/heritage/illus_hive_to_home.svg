<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- FROM HIVE TO HOME: Honeycomb + Bees + Honey Drop -->
  <g stroke="#6B3F1A" stroke-linecap="round" stroke-linejoin="round">

    <!-- HONEYCOMB GRID - centered, filling most of the canvas -->
    <!-- Row 1 (top, 2 hexagons) -->
    <polygon points="85,22 100,13 115,22 115,40 100,49 85,40" stroke-width="1.4" fill="none"/>
    <polygon points="115,22 130,13 145,22 145,40 130,49 115,40" stroke-width="1.4" fill="none"/>

    <!-- Row 2 (3 hexagons) -->
    <polygon points="70,49 85,40 100,49 100,67 85,76 70,67" stroke-width="1.4" fill="none"/>
    <polygon points="100,49 115,40 130,49 130,67 115,76 100,67" stroke-width="1.4" fill="none"/>
    <polygon points="130,49 145,40 160,49 160,67 145,76 130,67" stroke-width="1.4" fill="none"/>

    <!-- Row 3 (4 hexagons) -->
    <polygon points="55,76 70,67 85,76 85,94 70,103 55,94" stroke-width="1.4" fill="none"/>
    <polygon points="85,76 100,67 115,76 115,94 100,103 85,94" stroke-width="1.4" fill="none"/>
    <polygon points="115,76 130,67 145,76 145,94 130,103 115,94" stroke-width="1.4" fill="none"/>
    <polygon points="145,76 160,67 175,76 175,94 160,103 145,94" stroke-width="1.4" fill="none"/>

    <!-- Row 4 (3 hexagons) -->
    <polygon points="70,103 85,94 100,103 100,121 85,130 70,121" stroke-width="1.4" fill="none"/>
    <polygon points="100,103 115,94 130,103 130,121 115,130 100,121" stroke-width="1.4" fill="none"/>
    <polygon points="130,103 145,94 160,103 160,121 145,130 130,121" stroke-width="1.4" fill="none"/>

    <!-- Row 5 (2 hexagons) -->
    <polygon points="85,130 100,121 115,130 115,148 100,157 85,148" stroke-width="1.4" fill="none"/>
    <polygon points="115,130 130,121 145,130 145,148 130,157 115,148" stroke-width="1.4" fill="none"/>

    <!-- Honey drips from bottom of comb -->
    <path d="M95,157 Q94,166 91,170 Q89,175 92,178 Q95,181 98,178 Q101,175 99,168 Q97,162 95,157Z" stroke-width="1.2" fill="none"/>
    <path d="M120,157 Q119,168 117,173 Q115,179 118,183 Q121,186 124,183 Q127,180 125,172 Q123,165 120,157Z" stroke-width="1.2" fill="none"/>

    <!-- BEE 1 - top right -->
    <ellipse cx="175" cy="30" rx="10" ry="6" stroke-width="1.3" fill="none"/>
    <line x1="168" y1="28" x2="165" y2="28" stroke-width="1.1"/>
    <line x1="182" y1="28" x2="185" y2="25" stroke-width="1.1"/>
    <!-- Bee body stripes -->
    <line x1="170" y1="26" x2="170" y2="34" stroke-width="0.9"/>
    <line x1="175" y1="24" x2="175" y2="36" stroke-width="0.9"/>
    <line x1="180" y1="26" x2="180" y2="34" stroke-width="0.9"/>
    <!-- Bee wings -->
    <ellipse cx="172" cy="24" rx="6" ry="4" stroke-width="0.9" fill="none" transform="rotate(-20 172 24)"/>
    <ellipse cx="178" cy="24" rx="5" ry="3" stroke-width="0.9" fill="none" transform="rotate(15 178 24)"/>
    <!-- Bee head -->
    <circle cx="165" cy="30" r="3.5" stroke-width="1.2" fill="none"/>
    <!-- Antennae -->
    <path d="M163,27 Q161,23 159,21" stroke-width="0.9"/>
    <path d="M167,27 Q167,22 168,20" stroke-width="0.9"/>
    <circle cx="159" cy="21" r="1" stroke-width="0.8" fill="none"/>
    <circle cx="168" cy="20" r="1" stroke-width="0.8" fill="none"/>

    <!-- BEE 2 - lower left -->
    <ellipse cx="42" cy="110" rx="9" ry="5.5" stroke-width="1.3" fill="none"/>
    <line x1="35" y1="108" x2="32" y2="108" stroke-width="1.1"/>
    <line x1="48" y1="108" x2="51" y2="106" stroke-width="1.1"/>
    <line x1="38" y1="106" x2="38" y2="114" stroke-width="0.9"/>
    <line x1="43" y1="104" x2="43" y2="116" stroke-width="0.9"/>
    <line x1="48" y1="106" x2="48" y2="114" stroke-width="0.9"/>
    <ellipse cx="40" cy="104" rx="5" ry="3.5" stroke-width="0.9" fill="none" transform="rotate(-15 40 104)"/>
    <ellipse cx="46" cy="104" rx="4.5" ry="3" stroke-width="0.9" fill="none" transform="rotate(20 46 104)"/>
    <circle cx="32" cy="110" r="3" stroke-width="1.2" fill="none"/>
    <path d="M30,107 Q28,103 26,101" stroke-width="0.9"/>
    <path d="M34,107 Q34,102 35,100" stroke-width="0.9"/>
    <circle cx="26" cy="101" r="1" stroke-width="0.8" fill="none"/>
    <circle cx="35" cy="100" r="1" stroke-width="0.8" fill="none"/>

    <!-- BEE 3 - flying near top-center -->
    <ellipse cx="115" cy="8" rx="8" ry="4.5" stroke-width="1.2" fill="none"/>
    <line x1="109" y1="6" x2="107" y2="6" stroke-width="1.0"/>
    <line x1="121" y1="6" x2="124" y2="4" stroke-width="1.0"/>
    <line x1="111" y1="4" x2="111" y2="12" stroke-width="0.8"/>
    <line x1="115" y1="3" x2="115" y2="13" stroke-width="0.8"/>
    <line x1="119" y1="4" x2="119" y2="12" stroke-width="0.8"/>
    <ellipse cx="112" cy="3" rx="4.5" ry="2.5" stroke-width="0.8" fill="none" transform="rotate(-10 112 3)"/>
    <ellipse cx="118" cy="3" rx="4" ry="2.5" stroke-width="0.8" fill="none" transform="rotate(10 118 3)"/>
    <circle cx="107" cy="8" r="2.5" stroke-width="1.1" fill="none"/>

    <!-- Honey jar outline at bottom-center -->
    <path d="M95,190 Q90,188 88,183 L85,170 L155,170 L152,183 Q150,188 145,190 Z" stroke-width="1.5" fill="none"/>
    <!-- Jar neck -->
    <path d="M100,170 L100,162 Q100,158 105,158 L135,158 Q140,158 140,162 L140,170" stroke-width="1.4" fill="none"/>
    <!-- Jar lid -->
    <rect x="102" y="154" width="36" height="6" rx="2" stroke-width="1.4" fill="none"/>
    <!-- Honey level inside jar -->
    <path d="M87,178 Q120,182 153,178" stroke-width="1.0" stroke-dasharray="3,2"/>
    <!-- Jar label decoration -->
    <rect x="95" y="173" width="50" height="14" rx="2" stroke-width="0.9" fill="none"/>
    <!-- Honeycomb motif on label -->
    <path d="M112,177 L116,175 L120,177 L120,181 L116,183 L112,181Z" stroke-width="0.7" fill="none"/>
    <path d="M120,177 L124,175 L128,177 L128,181 L124,183 L120,181Z" stroke-width="0.7" fill="none"/>
    <!-- Honey drip from jar bottom -->
    <path d="M118,190 Q117,197 116,201 Q115,206 118,209 Q121,211 123,208 Q125,205 124,199 Q122,194 120,190Z" stroke-width="1.1" fill="none"/>

  </g>
</svg>
