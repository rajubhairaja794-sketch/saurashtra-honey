<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- PURE BY NATURE: Honey Jar + Dipper + Drops + Botanicals -->
  <g stroke="#6B3F1A" stroke-linecap="round" stroke-linejoin="round">

    <!-- MAIN HONEY JAR - large, centered -->
    <!-- Jar body -->
    <path d="M72,210 Q64,208 62,200 L58,155 Q56,148 60,144 L68,138 L68,125 L172,125 L172,138 L180,144 Q184,148 182,155 L178,200 Q176,208 168,210 Z" stroke-width="2.0" fill="none"/>
    <!-- Jar shoulder curves -->
    <path d="M68,138 Q66,132 70,128" stroke-width="1.5" fill="none"/>
    <path d="M172,138 Q174,132 170,128" stroke-width="1.5" fill="none"/>

    <!-- Jar neck -->
    <path d="M68,125 Q68,112 78,110 L162,110 Q172,112 172,125" stroke-width="1.8" fill="none"/>

    <!-- Jar lid -->
    <rect x="74" y="98" width="92" height="14" rx="6" stroke-width="1.8" fill="none"/>
    <!-- Lid top bump -->
    <path d="M100,98 Q120,92 140,98" stroke-width="1.4" fill="none"/>
    <!-- Lid knob -->
    <circle cx="120" cy="91" r="5" stroke-width="1.3" fill="none"/>
    <line x1="120" y1="86" x2="120" y2="82" stroke-width="1.2"/>

    <!-- Honey level inside jar (wavy line) -->
    <path d="M60,175 Q80,170 100,173 Q120,176 140,172 Q160,168 180,172" stroke-width="1.1" fill="none"/>

    <!-- Jar label -->
    <rect x="70" y="148" width="100" height="30" rx="4" stroke-width="1.2" fill="none"/>
    <!-- Label inner border -->
    <rect x="74" y="152" width="92" height="22" rx="2" stroke-width="0.7" fill="none"/>
    <!-- Label honeycomb pattern -->
    <polygon points="105,159 110,156 115,159 115,165 110,168 105,165" stroke-width="0.8" fill="none"/>
    <polygon points="115,159 120,156 125,159 125,165 120,168 115,165" stroke-width="0.8" fill="none"/>
    <polygon points="125,159 130,156 135,159 135,165 130,168 125,165" stroke-width="0.8" fill="none"/>

    <!-- HONEY DIPPER - resting on jar at angle -->
    <line x1="155" y1="80" x2="220" y2="30" stroke-width="1.8"/>
    <!-- Dipper head -->
    <ellipse cx="152" cy="83" rx="12" ry="9" stroke-width="1.6" fill="none"/>
    <!-- Dipper head rings -->
    <path d="M141,83 Q152,78 163,83" stroke-width="0.9" fill="none"/>
    <path d="M141,86 Q152,81 163,86" stroke-width="0.9" fill="none"/>
    <path d="M141,89 Q152,84 163,89" stroke-width="0.9" fill="none"/>
    <!-- Dipper handle grip rings -->
    <line x1="175" y1="62" x2="180" y2="58" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="185" y1="53" x2="190" y2="49" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="194" y1="44" x2="199" y2="40" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Dipper handle tip -->
    <circle cx="220" cy="30" r="3" stroke-width="1.3" fill="none"/>

    <!-- Honey drips from dipper -->
    <path d="M148,92 Q147,100 146,105 Q144,111 147,115 Q150,118 152,115 Q155,111 153,105 Q151,98 149,92Z" stroke-width="1.1" fill="none"/>
    <path d="M156,90 Q155,97 154,101 Q153,106 156,108 Q159,110 161,107 Q163,103 162,97 Q160,93 157,90Z" stroke-width="1.1" fill="none"/>

    <!-- Main honey drip from jar bottom center -->
    <path d="M115,210 Q113,218 112,223 Q110,230 114,234 Q118,237 122,234 Q126,230 124,223 Q122,217 119,210Z" stroke-width="1.3" fill="none"/>

    <!-- BOTANICAL SPRIGS - left side -->
    <!-- Left main sprig stem -->
    <path d="M42,175 Q38,160 35,145 Q32,130 36,115 Q40,100 36,85" stroke-width="1.4" fill="none"/>
    <!-- Left leaves -->
    <ellipse cx="44" cy="150" rx="10" ry="5" stroke-width="1.1" fill="none" transform="rotate(-35 44 150)"/>
    <line x1="38" y1="155" x2="49" y2="145" stroke-width="0.7"/>
    <ellipse cx="40" cy="128" rx="10" ry="5" stroke-width="1.1" fill="none" transform="rotate(-40 40 128)"/>
    <line x1="34" y1="133" x2="45" y2="122" stroke-width="0.7"/>
    <ellipse cx="38" cy="105" rx="9" ry="4.5" stroke-width="1.0" fill="none" transform="rotate(-30 38 105)"/>
    <!-- Left flower bud -->
    <path d="M34,82 Q30,76 28,70" stroke-width="1.1" fill="none"/>
    <ellipse cx="26" cy="66" rx="5" ry="8" stroke-width="1.1" fill="none"/>
    <ellipse cx="20" cy="70" rx="5" ry="7" stroke-width="1.0" fill="none" transform="rotate(-20 20 70)"/>
    <ellipse cx="32" cy="70" rx="5" ry="7" stroke-width="1.0" fill="none" transform="rotate(20 32 70)"/>
    <circle cx="26" cy="63" r="3.5" stroke-width="1.0" fill="none"/>

    <!-- BOTANICAL SPRIGS - right side -->
    <path d="M198,170 Q202,155 204,140 Q206,125 202,108 Q198,92 203,78" stroke-width="1.4" fill="none"/>
    <!-- Right leaves -->
    <ellipse cx="192" cy="145" rx="10" ry="5" stroke-width="1.1" fill="none" transform="rotate(35 192 145)"/>
    <line x1="197" y1="150" x2="187" y2="140" stroke-width="0.7"/>
    <ellipse cx="196" cy="122" rx="10" ry="5" stroke-width="1.1" fill="none" transform="rotate(40 196 122)"/>
    <line x1="202" y1="127" x2="191" y2="117" stroke-width="0.7"/>
    <ellipse cx="200" cy="100" rx="9" ry="4.5" stroke-width="1.0" fill="none" transform="rotate(30 200 100)"/>
    <!-- Right flower bud -->
    <path d="M205,75 Q209,69 211,63" stroke-width="1.1" fill="none"/>
    <ellipse cx="213" cy="59" rx="5" ry="8" stroke-width="1.1" fill="none"/>
    <ellipse cx="207" cy="63" rx="5" ry="7" stroke-width="1.0" fill="none" transform="rotate(-20 207 63)"/>
    <ellipse cx="219" cy="63" rx="5" ry="7" stroke-width="1.0" fill="none" transform="rotate(20 219 63)"/>
    <circle cx="213" cy="56" r="3.5" stroke-width="1.0" fill="none"/>

    <!-- Floating honey drops in background -->
    <path d="M48,195 Q47,200 46,203 Q45,207 47,209 Q50,211 52,208 Q54,205 53,200 Q51,196 49,195Z" stroke-width="1.0" fill="none"/>
    <path d="M190,200 Q189,205 188,208 Q187,212 190,214 Q192,215 194,212 Q196,209 195,204 Q193,200 191,200Z" stroke-width="1.0" fill="none"/>

    <!-- Small hexagon accents floating -->
    <polygon points="38,62 42,59 46,62 46,68 42,71 38,68" stroke-width="0.9" fill="none"/>
    <polygon points="195,50 199,47 203,50 203,56 199,59 195,56" stroke-width="0.9" fill="none"/>

  </g>
</svg>
